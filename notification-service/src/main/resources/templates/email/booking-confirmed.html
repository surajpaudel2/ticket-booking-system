<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;font-family:Arial,sans-serif;background-color:#f4f6f8;">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 20px;">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

                <!-- Header — green for confirmation -->
                <tr>
                    <td style="background-color:#0d1b2e;padding:28px 40px;text-align:center;">
                        <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:bold;letter-spacing:1px;">
                            TBS — Ticket Booking System
                        </h1>
                    </td>
                </tr>

                <!-- Green confirmation banner -->
                <tr>
                    <td style="background-color:#276749;padding:20px 40px;text-align:center;">
                        <p style="color:#ffffff;font-size:20px;font-weight:bold;margin:0;">
                            Your booking is confirmed!
                        </p>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:40px;">

                        <p style="font-size:16px;color:#333333;margin:0 0 8px 0;">
                            Hi <strong th:text="${recipientFullName}"></strong>,
                        </p>
                        <p style="font-size:15px;color:#555555;margin:0 0 24px 0;">
                            You're all set. Here's your booking summary.
                        </p>

                        <!-- Match details -->
                        <div style="background-color:#f0fff4;border:1px solid #9ae6b4;border-radius:6px;padding:20px;margin-bottom:24px;text-align:center;">
                            <h2 style="color:#0d1b2e;margin:0 0 8px 0;font-size:20px;">
                                <span th:text="${homeTeamName}"></span>
                                <span style="color:#888888;"> vs </span>
                                <span th:text="${awayTeamName}"></span>
                            </h2>
                            <p style="color:#555555;margin:0 0 4px 0;font-size:14px;"
                               th:text="${#temporals.format(matchDateTime, 'EEEE, dd MMMM yyyy HH:mm')}"></p>
                            <p th:if="${stadiumName != null}"
                               style="color:#888888;margin:0;font-size:13px;" th:text="${stadiumName}"></p>
                        </div>

                        <!-- Booking summary -->
                        <table cellpadding="0" cellspacing="0" width="100%"
                               style="border-radius:6px;border:1px solid #c6f6d5;margin-bottom:24px;">
                            <tr style="background-color:#f0fff4;">
                                <td colspan="2" style="padding:12px 16px;font-weight:bold;color:#276749;font-size:13px;
                                    text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #c6f6d5;">
                                    Booking Details
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:10px 16px;color:#555555;font-size:14px;border-bottom:1px solid #e8f5e9;">Tickets</td>
                                <td style="padding:10px 16px;color:#0d1b2e;font-weight:bold;font-size:14px;
                                    text-align:right;border-bottom:1px solid #e8f5e9;" th:text="${numberOfTickets}"></td>
                            </tr>
                            <tr>
                                <td style="padding:10px 16px;color:#555555;font-size:14px;border-bottom:1px solid #e8f5e9;">Total paid</td>
                                <td style="padding:10px 16px;color:#276749;font-weight:bold;font-size:16px;
                                    text-align:right;border-bottom:1px solid #e8f5e9;"
                                    th:text="'$' + ${#numbers.formatDecimal(totalAmountPaid, 1, 2)}"></td>
                            </tr>
                            <tr>
                                <td style="padding:10px 16px;color:#555555;font-size:14px;">Confirmed at</td>
                                <td style="padding:10px 16px;color:#0d1b2e;font-weight:bold;font-size:14px;text-align:right;"
                                    th:text="${#temporals.format(confirmedAt, 'dd MMM yyyy, HH:mm')}"></td>
                            </tr>
                        </table>

                        <p style="color:#555555;font-size:14px;">
                            Enjoy the match! Present this confirmation at the venue entrance.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f4f6f8;padding:20px 40px;text-align:center;border-top:1px solid #e0e0e0;">
                        <p style="color:#888888;font-size:12px;margin:0;" th:text="#{email.footer}"></p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
