<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;font-family:Arial,sans-serif;background-color:#f4f6f8;">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 20px;">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

                <!-- Header — red for 5-minute urgency, amber for 10-minute -->
                <tr th:if="${minutesRemaining == 5}">
                    <td style="background-color:#c53030;padding:28px 40px;text-align:center;">
                        <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:bold;letter-spacing:1px;">
                            TBS — Ticket Booking System
                        </h1>
                    </td>
                </tr>
                <tr th:if="${minutesRemaining != 5}">
                    <td style="background-color:#0d1b2e;padding:28px 40px;text-align:center;">
                        <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:bold;letter-spacing:1px;">
                            TBS — Ticket Booking System
                        </h1>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:40px;">

                        <p style="font-size:16px;color:#333333;margin:0 0 8px 0;">
                            Hi <strong th:text="${recipientName}"></strong>,
                        </p>

                        <!-- 5 minutes — red urgency -->
                        <div th:if="${minutesRemaining == 5}"
                             style="background-color:#fff5f5;border-left:4px solid #e53e3e;padding:16px;border-radius:4px;margin-bottom:24px;">
                            <p style="color:#e53e3e;font-weight:bold;font-size:20px;margin:0 0 4px 0;"
                               th:text="'Final Warning: ' + ${minutesRemaining} + ' minutes left to pay!'"></p>
                            <p style="color:#555555;font-size:14px;margin:0;">
                                Your booking will expire and seats will be released immediately after the deadline.
                            </p>
                        </div>

                        <!-- 10 minutes — amber urgency -->
                        <div th:if="${minutesRemaining == 10}"
                             style="background-color:#fffbeb;border-left:4px solid #d69e2e;padding:16px;border-radius:4px;margin-bottom:24px;">
                            <p style="color:#92400e;font-weight:bold;font-size:18px;margin:0 0 4px 0;"
                               th:text="${minutesRemaining} + ' minutes left to complete your payment.'"></p>
                            <p style="color:#555555;font-size:14px;margin:0;">
                                Act now to secure your seats before your booking expires.
                            </p>
                        </div>

                        <!-- Match details -->
                        <div style="background-color:#f0f4f8;border-radius:6px;padding:20px;margin-bottom:24px;text-align:center;">
                            <h2 style="color:#0d1b2e;margin:0 0 8px 0;font-size:20px;">
                                <span th:text="${homeTeamName}"></span>
                                <span style="color:#888888;"> vs </span>
                                <span th:text="${awayTeamName}"></span>
                            </h2>
                            <p style="color:#555555;margin:0;font-size:14px;"
                               th:text="${#temporals.format(matchDateTime, 'EEEE, dd MMMM yyyy HH:mm')}"></p>
                        </div>

                        <!-- Expiry countdown -->
                        <div style="text-align:center;margin-bottom:24px;">
                            <p style="color:#555555;font-size:13px;margin:0 0 4px 0;">Your booking expires at</p>
                            <p style="font-size:22px;font-weight:bold;margin:0;"
                               th:style="${minutesRemaining == 5} ? 'color:#e53e3e;' : 'color:#d69e2e;'"
                               th:text="${#temporals.format(expiresAt, 'dd MMM yyyy, HH:mm')}"></p>
                        </div>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f4f6f8;padding:20px 40px;text-align:center;border-top:1px solid #e0e0e0;">
                        <p style="color:#888888;font-size:12px;margin:0;" th:text="#{email.footer}"></p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
